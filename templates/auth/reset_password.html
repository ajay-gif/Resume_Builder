{% extends 'base.html' %}
{% block title %}Set New Password - Academic Career Nexus{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-10">
    <div class="relative w-full bg-surface-container-lowest rounded-2xl shadow-xl border border-outline-variant/40 overflow-hidden">
        <!-- 5px Architectural Top Accent Bar -->
        <div class="w-full h-[5px] bg-primary-container"></div>

        <div class="p-6 sm:p-8 flex flex-col gap-6">
            <!-- Logo & Header -->
            <div class="flex flex-col items-center text-center">
                <div class="w-14 h-14 rounded-2xl bg-surface-container-low border border-outline-variant/50 flex items-center justify-center p-2 mb-3 shadow-sm text-primary">
                    <span class="material-symbols-outlined text-[32px]">key</span>
                </div>
                <div class="inline-flex items-center gap-1.5 px-3 py-0.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-semibold text-xs mb-2">
                    <span class="material-symbols-outlined text-[13px] text-primary">verified_user</span>
                    <span>Verified Link</span>
                </div>
                <h1 class="text-2xl font-bold text-on-surface tracking-tight">Set New Password</h1>
                <p class="text-sm text-on-surface-variant max-w-[310px] mt-1 leading-relaxed">
                    Create a strong, unique password for <strong class="text-on-surface">{{ email }}</strong>.
                </p>
            </div>

            <!-- Reset Password Form -->
            <form method="POST" class="flex flex-col gap-4">
                <!-- New Password Field -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface" for="password">New Password</label>
                    <div class="relative flex items-center rounded-xl bg-surface-container-low border border-outline-variant/60 focus-within:border-primary-container focus-within:bg-white focus-within:ring-2 focus-within:ring-primary-container/20 transition-all">
                        <span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">lock</span>
                        <input class="w-full h-11 pl-11 pr-3 bg-transparent rounded-xl text-sm text-on-surface placeholder:text-outline/70 focus:outline-none" id="password" name="password" placeholder="At least 6 characters" type="password" minlength="6" required/>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold text-on-surface" for="confirm_password">Confirm New Password</label>
                    <div class="relative flex items-center rounded-xl bg-surface-container-low border border-outline-variant/60 focus-within:border-primary-container focus-within:bg-white focus-within:ring-2 focus-within:ring-primary-container/20 transition-all">
                        <span class="material-symbols-outlined absolute left-3.5 text-secondary text-[20px] pointer-events-none">lock_clock</span>
                        <input class="w-full h-11 pl-11 pr-3 bg-transparent rounded-xl text-sm text-on-surface placeholder:text-outline/70 focus:outline-none" id="confirm_password" name="confirm_password" placeholder="Re-type new password" type="password" minlength="6" required/>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3 px-4 rounded-xl bg-primary-container hover:bg-primary text-white font-bold text-sm flex items-center justify-center gap-2 shadow-md transition-all active:scale-[0.98] mt-2">
                    <span class="material-symbols-outlined text-[18px]">check_circle</span>
                    <span>Update Password & Proceed</span>
                </button>
            </form>

            <div class="pt-2 border-t border-surface-container-highest/60 text-center">
                <a href="{{ url_for('login') }}" class="inline-flex items-center gap-1.5 text-xs font-bold text-primary hover:underline">
                    <span class="material-symbols-outlined text-[15px]">arrow_back</span>
                    <span>Back to Sign In</span>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

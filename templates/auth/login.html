{% extends 'base.html' %}
{% block title %}Log In - ResumeBuilder{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Welcome Back</h2>
    <p class="auth-sub">Access and update your target resumes</p>
    <form method="POST">
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email" required placeholder="you@university.edu">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-primary w-100">Log In</button>
    </form>
    <p class="auth-footer">Don't have an account? <a href="{{ url_for('register') }}">Sign up here</a></p>
</div>
{% endblock %}
